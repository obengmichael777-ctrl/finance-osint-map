stores:
  store_CN_001:
    country: CN
    file_metadata:
      currency: CNY
      timezone: Asia/Shanghai
    file_pattern: store_CN_001_sales_*.xlsx
    lat: 39.925671
    lon: 116.365305
    region: Greater China
    sheets:
      sales_transactions:
        columns:
          customer_id:
            data_type: string
            default_value: UNKNOWN
            required: false
            source_name: Customer ID
          date:
            data_type: date
            required: true
            source_name: Transaction Date
            validation_rules:
              not_null: true
          payment_method:
            data_type: category
            required: false
            source_name: Payment Type
            validation_rules:
              allowed_values:
              - CASH
              - CREDIT
              - DEBIT
              - MOBILE
              - E-WALLET
          product_id:
            data_type: string
            required: true
            source_name: SKU
          qty:
            data_type: integer
            required: true
            source_name: Qty Sold
            validation_rules:
              max: 100000
              min: -100
          revenue:
            data_type: float
            required: true
            source_name: Net Sales
            validation_rules:
              min: -50000
        header_row: 0
        sheet_name: regex:^(Sales_|Daily_Sales_|销售_|売上_)
        skip_rows: 0
